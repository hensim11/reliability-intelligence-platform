[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-intelligence"
version = "0.1.0"
description = "Reproducible synthetic service telemetry and incident forecasting foundations"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "pyarrow>=18,<26", "matplotlib>=3.9,<4", "scikit-learn>=1.9,<2", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
reliability = "reliability_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
