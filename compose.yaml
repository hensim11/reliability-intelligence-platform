services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: reliability
      POSTGRES_PASSWORD: ${RIP_DB_PASSWORD:?Set RIP_DB_PASSWORD in .env}
      POSTGRES_DB: reliability
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliability -d reliability"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    environment:
      RIP_DATABASE_URL: postgresql+psycopg://reliability:${RIP_DB_PASSWORD:?Set RIP_DB_PASSWORD}@db:5432/reliability
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      RIP_DATABASE_URL: postgresql+psycopg://reliability:${RIP_DB_PASSWORD:?Set RIP_DB_PASSWORD}@db:5432/reliability
      RIP_MODEL_DIR: /model
    volumes:
      - ${RIP_MODEL_DIR:?Set RIP_MODEL_DIR to a frozen Batch B experiment directory}:/model:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  postgres_data:
